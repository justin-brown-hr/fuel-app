name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements*.txt"
      - "fuel_reconcile.spec"
      - "build/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build single-file exe
        run: pyinstaller fuel_reconcile.spec --noconfirm --clean

      - name: Package for client
        run: |
          mkdir dist\client_package
          copy dist\FuelReconcile.exe dist\client_package\
          copy build\windows\START_HERE.txt dist\client_package\
          copy docs\WINDOWS_INSTALL.md dist\client_package\INSTALL.txt
          powershell Compress-Archive -Path dist\client_package\* -DestinationPath dist\FuelReconcile-Client.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuelReconcile-Client-zip
          path: |
            dist/FuelReconcile.exe
            dist/FuelReconcile-Client.zip
          retention-days: 90
